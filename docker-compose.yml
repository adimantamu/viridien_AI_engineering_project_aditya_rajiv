# Intelligent Bistro — run the API with Docker Compose
# Usage: docker compose up --build -d
# Mobile app still runs locally via Expo (see README.md)

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelligent-bistro-api
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
